name: Turbopack test build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: Build amd64 (Turbopack=1, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.3

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: amd64
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./omniroute
          image: ghcr.io/grunjol/addon-omniroute
          image-tags: turbopack-test
          version: 3.8.50.0
          build-args: OMNIROUTE_USE_TURBOPACK=1
          push: 'false'
          cosign: 'false'
          cache-gha: 'false'
